<h1>Opening hours over the holidays</h1>
<p>SCHEMAVIS-MAIN The library is closed from the twenty-fourth to the twenty-sixth and opens again on the twenty-seventh at ten. Books that fall due in that week can be returned until the second of January without a fee. SCHEMAVIS-END</p>
